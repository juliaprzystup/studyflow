# Konfiguracja Nginx (reverse proxy) dla aplikacji StudyFlow.
# Skopiuj na serwerze do: /etc/nginx/sites-available/studyflow
# a nastepnie utworz link: ln -s /etc/nginx/sites-available/studyflow /etc/nginx/sites-enabled/
# Po dodaniu domeny i HTTPS (Certbot) plik zostanie automatycznie rozbudowany.

server {
    listen 80;
    # Wpisz adres IP serwera lub swoja domene, np. studyflow.example.com
    server_name TWOJ_ADRES_IP_LUB_DOMENA;

    # Limit zgodny z MAX_CONTENT_LENGTH aplikacji (16 MB) + zapas.
    # Bez tego Nginx odrzucilby duzy plik zanim trafi do Flaska.
    client_max_body_size 20M;

    # Pliki statyczne (CSS, JS) serwuje bezposrednio Nginx - szybciej.
    location /static/ {
        alias /home/studyflow/fiszki_app/static/;
        expires 7d;
    }

    # Caly pozostaly ruch przekazujemy do Gunicorna.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # NLP potrafi przetwarzac dluzej - wydluzamy czas oczekiwania.
        proxy_read_timeout 120s;
    }
}
