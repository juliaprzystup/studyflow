{% extends "base.html" %}

{% block title %}Logowanie - StudyFlow{% endblock %}

{% block content %}
<section class="row justify-content-center">
    <div class="col-lg-6 col-xl-5">
        <div class="page-header mb-4">
            <div>
                <span class="badge text-bg-light px-3 py-2 mb-3">Welcome back</span>
                <h1 class="mb-2">Logowanie</h1>
                <p class="mb-0">Zaloguj się, aby zarządzać dokumentami, quizami i fiszkami.</p>
            </div>
            <a href="{{ url_for('register') }}" class="btn btn-primary">Załóż konto</a>
        </div>
        <div class="card">
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Hasło</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Zaloguj się</button>
                    </div>
                </form>
                <hr class="my-4">
                <p class="text-center mb-0">Nie masz konta? <a href="{{ url_for('register') }}">Zarejestruj się</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
